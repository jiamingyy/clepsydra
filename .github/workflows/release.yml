name: Build & Release

# 推送 v* 标签（或手动触发）时：全平台构建并发布到 GitHub Releases
# 发版流程：更新 src-tauri/tauri.conf.json 的 version → 提交 → 打 tag v{version} → 推送 tag
# 手动触发（workflow_dispatch）时未指定 tag，自动回退为 tauri.conf.json 里的版本号
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 同一分支的新提交会取消仍在进行的旧构建
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write # tauri-action 创建 Release 需要写权限
    strategy:
      fail-fast: false # 某个平台失败不影响其他平台继续发布
      matrix:
        include:
          - platform: macos-latest # Apple Silicon (M 系列)
            args: --target aarch64-apple-darwin
          - platform: macos-latest # Intel Mac
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 版本读自 package.json 的 packageManager 字段
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 需要额外交叉编译目标
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 Linux 系统依赖 (Tauri 2)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 仅在 tag 触发时校验：防止 tag 与应用版本号不一致导致发布混乱
      - name: 校验 tag 与 tauri.conf.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 tauri.conf.json 版本 v$VERSION 不一致，请先更新版本号再打 tag"
            exit 1
          fi

      - name: 构建并发布 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tag 触发时用推送的标签名；手动触发时回退为 tauri.conf.json 的版本号
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Clepsydra {0}', github.ref_name) || 'Clepsydra v__VERSION__' }}
          releaseBody: '在 Assets 中下载对应平台的安装包。'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
